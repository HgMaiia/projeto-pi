<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class='entradas'>
        

        <div class='cabecalho'>
            <h1 class="titulo">Simulador Financeiro</h1>
            <h2 class="subtitulo">Ganhos e Perdas na apicultura</h2>
        </div>


        <p>Insira o valor do Kg do mel: <br><input id='valorMel'></p>
        <p>Insira a quantidade total de mel produzido no último mês (em Kg): <br><input id='totalMel'></p>
        <p>Insira quantas colmeias você possui: <br><input id='totalColmeias'></p>

        <div class="botao">
            <button onclick='calcularMel()'>Calcular produção de Mel</button>
        </div>
        
 
        <div id='texto' class='resultados resultado'></div>
    </div>

</body>
<script>
    let perdaAcumulada = 0
    let rendaBruta = 0

    function calcularMel() {
        let precoKg = Number(valorMel.value)
        let melProduzido = Number(totalMel.value)
        let Colmeias = Number(totalColmeias.value)

        let mediaMel = (melProduzido / Colmeias)
        let rendaColmeia = (mediaMel * precoKg)
        let rendaTotal = (rendaColmeia * Colmeias)
        let reducaoEnx = (rendaTotal / 2)

        if (valorMel.value.length == 0) {
            alert('Não foi inserido entrada para o valor do mel. Insira novamente.')
        } else if (totalMel.value.length == 0) {
            alert('Não foi inserido entrada para o total de mel. Insira novamente.')
        } else if (totalColmeias.value.length == 0) {
            alert('Não foi inserido entrada para o total de colmeias. Insira novamente.')
        } else if (precoKg <= 0) {
            alert('Valor inválido para o Kg do mel. Insira novamente.')
        } else if (Colmeias <= 0) {
            alert('Valor inválido para a quantidade de colmeias. Insira novamente.')
        } else if (melProduzido < 0) {
            alert('Valor inválido para a quantidade de mel produzido. Insira novamente.')
        } else {
            perdaAcumulada = perdaAcumulada - reducaoEnx
            rendaBruta = rendaBruta + rendaTotal

            valorMel.value = '';
            totalMel.value = '';
            totalColmeias.value = '';

            texto.innerHTML = `Com os valores inseridos, temos:<br><br>
    A média de mel produzido por colmeia (em quilograma): <div class= "ganhos">${mediaMel.toFixed(2)}Kg</div><br><br>
    
    Em caso de enxameação, a sua perda será de, aproximadamente, <b>50%</b> da produção total. Assim, a perda financeira será de: <b><div class= "perdas">R$${reducaoEnx.toFixed(2)}</b></div><br><br>
    
    Perda acumulada: <div class= "perdas"> <b>R$${perdaAcumulada.toFixed(2)}</div></b><br>
    Renda Bruta: <div class= "ganhos"> R$${rendaBruta.toFixed(2)}</div>`
        }
    }
</script>

</html>
