<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculadora Financeira </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="painel text">
        <h1> Calculadora de produção apicuária e Enxameação </h1><br>
        <div> Média de produção mensal (em quilos) de mel por colmeia: <input type="number" id="ipt_quilo" min="0"> </div> <br>
        <div class="row">
            <div> Número de Colmeias: <input type="number" id="ipt_colmeia" min="0"> </div> <br>
            <div> Valor do Mel por quilo: <input type="number" id="ipt_valor" min="0"> </div>
        </div> <br>
        <button onclick="calcular_valor()"> Calcular </button><br>
        <div class="msg" id="msg"></div>
    </div>
</body>
<script>
    function calcular_valor(){
        let erro = false;
        let mensagem = 'Os seguintes valores não podem ser vazios: ';
        let colmeia = Number(ipt_colmeia.value);
        let valor = Number(ipt_valor.value);
        let quilo = Number(ipt_quilo.value);
        let mel_total = Number(colmeia * quilo);
        let valor_total = ((mel_total)*valor).toFixed(2); // Renda mensal p/ colmeia atual

        // Valores no total após enxameação
        let mel_reduzido_min = Number(mel_total * 1.3).toFixed(2) // Renda Mínima adicional com a utilização do sistema (30%)
        let mel_reduzido_max = Number(mel_total * 1.7).toFixed(2) // Renda máxima adicional com a utilização do sistema (70%)
        let valor_aumentado_min = Number(mel_reduzido_min * valor).toFixed(2);  // Renda mensal com o nosso sistema (30%)
        let valor_aumentado_max = Number(mel_reduzido_max * valor).toFixed(2);  // Renda mensal com o nosso sistema (70%)

        // Valores perdidos no total, em caso de enxameação
        let mel_perdido_min = (mel_reduzido_min - mel_total).toFixed(2);
        let mel_perdido_max = (mel_reduzido_max - mel_total).toFixed(2);
        let valor_perdido_min = (valor_aumentado_min - valor_total).toFixed(2);
        let valor_perdido_max = (valor_aumentado_max - valor_total).toFixed(2);

        // Valores perdidos, por colmeia
        let mel_perdido_colmeia_min = (mel_perdido_min/colmeia).toFixed(2);
        let mel_perdido_colmeia_max = (mel_perdido_max/colmeia).toFixed(2);
        let valor_perdido_colmeia_min = (valor_perdido_min/colmeia).toFixed(2);
        let valor_perdido_colmeia_max = (valor_perdido_max/colmeia).toFixed(2);


        // Checagem de Valores dos Inputs. Checando se está preenchido e se é negativo.
        if (ipt_quilo.value.length == 0){
            erro = true
            mensagem += 'Produção Mensal, ';
        } 

        if (ipt_colmeia.value.length == 0){
            erro = true;
            mensagem += 'Número de Colmeias, ';
        } 
        
        if (ipt_valor.value.length == 0){
            erro = true;
            mensagem += 'Valor do Mel; '        
        }

        if (erro){
            alert(mensagem)
            msg.innerHTML = null
        }

/*      msg.innerHTML = `<br> Atualmente você produz ${mel_total} kg(s), rendendo R$${valor_total} ao mês <br> <br>
        Com o nosso sistema sua quantidade de mel aumentará de ${mel_total} kg(s) para um valor entre ${mel_reduzido_min} kg(s) e ${mel_reduzido_max} kg(s) <br>
        Rendendo para você um total de R$${valor_aumentado_min} á R$${valor_aumentado_max} <br>` */

        else {
            msg.innerHTML = 
            `
            <div class=resposta>
            Atualmente você produz ${mel_total} kg(s), rendendo R$${valor_total} ao mês. <br> <br>
            Porém, em um caso de enxameação, a sua quantidade de mel da colmeia pode reduzir em 30 á 70%! <br><br>

            Esta é uma redução de ${mel_perdido_colmeia_min} kg(s) á ${mel_perdido_colmeia_max} kg(s) por colmeia. <br>
            Uma queda de <b> R$${valor_perdido_colmeia_min} </b> á <b> R$${valor_perdido_colmeia_max} </b> todo mês. <br><br>

            Podendo alcançar, no total, entre ${mel_perdido_min} kg(s) e ${mel_perdido_max} kg(s) perdidos, <br>
            e uma perda em potêncial de <b> R$${valor_perdido_min} </b> á <b> R$${valor_perdido_max}! </b> <br>
            
            </div>
            `
    }
}
</script>
</html>
